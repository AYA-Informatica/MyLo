name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A newer push to the same branch makes an in-flight run obsolete.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The monorepo — apps/ and packages/ — which is what is actually being built.
  #
  # The two jobs below it run against MyLo-Backend and MyLo-frontend, the
  # original codebase docs/ESSENCE.md exists to extract lessons from. Those are
  # still in the tree and still tested, which means a green tick has until now
  # said nothing whatsoever about apps/api, apps/web, or any of packages/.
  # Decide whether to keep them; do not read them as coverage.
  monorepo:
    name: Monorepo
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      # --ignore-scripts skips husky, which has no work to do in CI.
      - run: npm ci --ignore-scripts

      - name: Type-check
        run: npm run typecheck

      - name: Format
        run: npm run format:check

      # Parsing logic that needs no PDF: heading grammar, stream classification,
      # law-number normalisation. Several are regressions for bugs that shipped.
      #
      # The stronger check is `npm run corpus:golden`, which re-parses real
      # documents and diffs the result. It cannot run here because the corpus is
      # not committed — whether a parsed derivative of the Gazette may be
      # redistributed is an open question for a lawyer (docs/PLAN.md, 0.4). Until
      # that is answered, golden is a local gate and this is the CI one.
      - name: Test
        run: npm test

  # The checks that need a database. Kept separate from the unit job so that a
  # failure here says "a safety property broke" rather than "something broke".
  invariants:
    name: Invariants
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mylo_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/mylo_ci

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --ignore-scripts

      # Also proves the runner works from nothing, which is what a deployment
      # does on its first boot.
      - name: Migrate from an empty database
        run: npm run db:migrate

      # A corpus is needed for the gate to have an article to attach an
      # explanation to. The committed fixture is authored here rather than taken
      # from the Gazette, so CI needs no corpus of its own.
      # Paths are absolute because `-w @mylo/corpus` changes the working
      # directory, so a path relative to the repository root resolves inside the
      # package instead.
      - name: Load the fixture corpus
        run: |
          npm run corpus:gazette -- "$PWD/packages/corpus/fixtures"
          echo '{"99/2099":"active","99/01":"active"}' > /tmp/status.json
          npm run corpus:load-gazette -- --status /tmp/status.json

      # The most important safety property in the system: nothing generated
      # reaches a reader unapproved. It was enforced by one clause in one join
      # and, until this ran anywhere automatically, was checked only when
      # somebody remembered.
      - name: Review gate
        run: npm run eval:gate

  backend:
    name: Backend
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mylo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: MyLo-Backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: MyLo-Backend/package-lock.json

      - run: npm ci

      - name: Type-check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

  # The checks that need a database. Kept separate from the unit job so that a
  # failure here says "a safety property broke" rather than "something broke".
  invariants:
    name: Invariants
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mylo_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/mylo_ci

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --ignore-scripts

      # Also proves the runner works from nothing, which is what a deployment
      # does on its first boot.
      - name: Migrate from an empty database
        run: npm run db:migrate

      # A corpus is needed for the gate to have an article to attach an
      # explanation to. The committed fixture is authored here rather than taken
      # from the Gazette, so CI needs no corpus of its own.
      # Paths are absolute because `-w @mylo/corpus` changes the working
      # directory, so a path relative to the repository root resolves inside the
      # package instead.
      - name: Load the fixture corpus
        run: |
          npm run corpus:gazette -- "$PWD/packages/corpus/fixtures"
          echo '{"99/2099":"active","99/01":"active"}' > /tmp/status.json
          npm run corpus:load-gazette -- --status /tmp/status.json

      # The most important safety property in the system: nothing generated
      # reaches a reader unapproved. It was enforced by one clause in one join
      # and, until this ran anywhere automatically, was checked only when
      # somebody remembered.
      - name: Review gate
        run: npm run eval:gate
        env:
          NODE_ENV: test
          TEST_HOST: localhost
          TEST_PORT: 5432
          TEST_USERNAME: postgres
          TEST_PASSWORD: postgres
          TEST_DATABASE: mylo_test
          TEST_SSLMODE: false
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          JWT_SECRET: ci-jwt-secret
          SESSION_SECRET: ci-session-secret

      - name: Build
        run: npm run build

  frontend:
    name: Frontend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: MyLo-frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: MyLo-frontend/package-lock.json

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
        env:
          # Build-time only; the real value is injected by the hosting platform.
          VITE_API_BASE_URL: http://localhost:5001/api/v1
